<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>My Feed</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #0f0f0f;
    color: #f1f1f1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    margin: 0;
    padding: 32px clamp(16px, 5vw, 48px);
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .sub {
    color: #9a9a9a;
    font-size: 13px;
    margin-bottom: 24px;
  }
  .setup {
    background: #1a1a1a;
    border: 1px solid #272727;
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 24px;
    max-width: 480px;
  }
  .setup label {
    font-size: 13px;
    font-weight: 600;
  }
  .setup .note {
    font-size: 12px;
    color: #9a9a9a;
    margin-top: 4px;
    line-height: 1.5;
  }
  .setup input {
    width: 100%;
    padding: 9px 10px;
    margin: 10px 0;
    background: #0f0f0f;
    border: 1px solid #303030;
    color: #fff;
    border-radius: 6px;
    font-size: 13px;
  }
  .setup button {
    background: #3ea6ff;
    color: #0f0f0f;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
  }
  .status {
    color: #9a9a9a;
    font-size: 13px;
    margin: 12px 0 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 18px;
  }
  .card {
    background: #1a1a1a;
    border-radius: 10px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.12s ease;
  }
  .card:hover { transform: translateY(-2px); }
  .card img {
    width: 100%;
    display: block;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: #272727;
  }
  .card .info { padding: 11px 12px; }
  .card .title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 5px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .meta {
    font-size: 11px;
    color: #9a9a9a;
  }
</style>
</head>
<body>
  <h1>My Feed</h1>
  <div class="sub">Latest uploads from your allowed channels — fetched directly, not recommended by YouTube's algorithm.</div>

  <div class="setup" id="setup">
    <label for="apiKey">YouTube Data API key</label>
    <div class="note">Free from Google Cloud Console, one-time setup. Stored locally in this extension only.</div>
    <input type="text" id="apiKey" placeholder="Paste your API key here">
    <button id="saveKey">Save &amp; load</button>
  </div>

  <div class="status" id="status"></div>
  <div class="grid" id="grid"></div>

  <script src="feed.js"></script>
</body>
</html>
